<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#F4F1EB">
<title>岫本・家庭成員</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#1F1D1A;-webkit-tap-highlight-color:transparent}#screen{position:fixed;left:0;top:0;width:390px;height:844px;transform-origin:0 0;overflow:hidden}</style>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&amp;family=Noto+Serif+TC:wght@500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#4F6644}a:hover{color:#3B4D33}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.r1{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}.r2{animation:rise .5s .08s cubic-bezier(.2,.8,.2,1) both}.r3{animation:rise .5s .16s cubic-bezier(.2,.8,.2,1) both}.r4{animation:rise .5s .24s cubic-bezier(.2,.8,.2,1) both}
.row{transition:background .2s,transform .15s}.row:active{transform:scale(.98)}
.sw{transition:background .25s}.sw i{transition:transform .25s cubic-bezier(.2,.8,.2,1)}
</style>

<script src="dc.js"></script>
</head><body>
<template id="tpl">
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #F4F1EB; color: #1F1D1A; font-family: -apple-system, 'SF Pro Text', 'Noto Sans TC', sans-serif; padding: 62px 20px 0">
<a href="Home.html" style="display: inline-flex; align-items: center; gap: 2px; min-height: 44px; font-size: 17px; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>今天</a>
<h1 class="r1" style="margin: 4px 0 0; font-family: 'Noto Serif TC', serif; font-weight: 700; font-size: 34px">家人</h1>
<p class="r1" style="margin: 6px 0 0; font-size: 14px; color: #6E685E">一個帳號可以加一位家人，兩人共用同一台岫本和全家的成就。</p>
<div class="r2" style="margin-top: 18px; background: #fff; border-radius: 20px; overflow: hidden">
<a class="row" href="Member.html" style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; color: #1F1D1A; text-decoration: none; border-bottom: 1px solid #EFE9DF">
<span style="display: grid; place-items: center; width: 46px; height: 46px; border-radius: 50%; background: #F1E6D6; color: #6B4E25; font-weight: 700; font-size: 17px">我</span>
<span style="flex: 1"><b style="display: block; font-weight: 500; font-size: 16px">我</b><span style="font-size: 13px; color: #6E685E">帳號擁有者・大人・拉高 50 mm</span></span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B5AEA2" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>
</a>
<a class="row" href="Member.html" style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; color: #1F1D1A; text-decoration: none">
<span style="display: grid; place-items: center; width: 46px; height: 46px; border-radius: 50%; background: #E3EBDC; color: #3B4D33; font-weight: 700; font-size: 17px">孩</span>
<span style="flex: 1"><b style="display: block; font-weight: 500; font-size: 16px">孩子</b><span style="font-size: 13px; color: #6E685E">家人・7 歲・收合 250 mm</span></span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B5AEA2" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>
</a>
</div>
<div class="r3" style="margin-top: 12px; display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 20px; border: 1.5px dashed #CFC6B6; color: #8A8478">
<span style="display: grid; place-items: center; width: 46px; height: 46px; border-radius: 50%; background: #ECE6DB; font-size: 24px">+</span>
<span style="flex: 1; font-size: 14px; line-height: 1.5">已經加了一位家人。<br>要換人，先在家人的頁面移除。</span>
</div>
<h2 class="r4" style="margin: 28px 0 8px; font-size: 13px; font-weight: 500; color: #6E685E; letter-spacing: 0.08em">家人的提醒</h2>
<div class="r4" style="background: #fff; border-radius: 20px; overflow: hidden">
<sc-for list="{{ rows }}" as="it" hint-placeholder-count="3">
<label style="display: flex; align-items: center; gap: 12px; padding: 0 16px; min-height: 56px; border-bottom: 1px solid #EFE9DF; cursor: pointer">
<span style="flex: 1; font-size: 15px">{{ it.label }}</span>
<input type="checkbox" checked="{{ it.on }}" onChange="{{ it.toggle }}" style="position: absolute; opacity: 0; width: 1px; height: 1px">
<span class="sw" style="{{ it.track }}"><i style="{{ it.knob }}"></i></span>
</label>
</sc-for>
</div>
<div style="position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: #1F1D1A"></div>
</div>
</template>
<div id="screen"></div>
<script>

class Component extends DCLogic {
  constructor(p){ super(p); this.state = { on: [true, true, false] }; }
  renderVals() {
    const L = ['孩子晚上 8:30 提醒使用', '用完提醒清洗藥杯', '藥瓶剩一瓶時提醒'];
    return { rows: L.map((label, i) => { const on = this.state.on[i]; return {
      label, on,
      toggle: () => { const a = this.state.on.slice(); a[i] = !a[i]; this.setState({ on: a }); },
      track: 'position:relative;display:block;width:51px;height:31px;border-radius:16px;background:' + (on ? '#4F6644' : '#DDD6CA'),
      knob: 'position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.18);transform:translateX(' + (on ? 20 : 0) + 'px)'
    }; }) };
  }
}

dcMount(Component, {});
</script>
</body></html>
