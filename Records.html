<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#F4F1EB">
<title>岫本・紀錄</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#1F1D1A;-webkit-tap-highlight-color:transparent}#screen{position:fixed;left:0;top:0;width:390px;height:844px;transform-origin:0 0;overflow:hidden}</style>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&amp;family=Noto+Serif+TC:wght@500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#4F6644}a:hover{color:#3B4D33}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.r1{animation:rise .5s both}.r2{animation:rise .5s .08s both}.r3{animation:rise .5s .16s both}
.bar{transition:height .6s cubic-bezier(.2,.8,.2,1)}
.knob{transition:left .35s cubic-bezier(.2,.8,.2,1)}
.num{transition:opacity .3s}
.row{transition:transform .15s}.row:active{transform:scale(.98)}
</style>

<script src="dc.js"></script>
</head><body>
<template id="tpl">
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #F4F1EB; color: #1F1D1A; font-family: -apple-system, 'SF Pro Text', 'Noto Sans TC', sans-serif; padding: 0">
<div style="position: absolute; left: 0; right: 0; top: 0; bottom: 88px; overflow-y: auto; box-sizing: border-box; padding: 62px 20px 20px">
<h1 class="r1" style="margin: 0; font-family: 'Noto Serif TC', serif; font-weight: 700; font-size: 34px">紀錄</h1>
<div class="r1" role="group" aria-label="看誰的紀錄" style="position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 14px; height: 36px; padding: 2px; border-radius: 10px; background: #E8E2D7">
<span class="knob" style="position: absolute; top: 2px; bottom: 2px; width: calc((100% - 4px)/3); left: {{ knob }}; border-radius: 8px; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.12)"></span>
<sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3">
<button onClick="{{ t.pick }}" aria-pressed="{{ t.on }}" style="position: relative; border: 0; background: none; font: inherit; font-size: 14px; color: #1F1D1A; cursor: pointer">{{ t.label }}</button>
</sc-for>
</div>
<div class="r2" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 14px">
<div style="padding: 12px; border-radius: 16px; background: #fff"><span style="font-size: 12px; color: #6E685E">本週次數</span><b class="num" style="display: block; font-family: 'Noto Serif TC', serif; font-size: 26px; font-weight: 700">{{ times }}</b></div>
<div style="padding: 12px; border-radius: 16px; background: #fff"><span style="font-size: 12px; color: #6E685E">總分鐘</span><b class="num" style="display: block; font-family: 'Noto Serif TC', serif; font-size: 26px; font-weight: 700">{{ mins }}</b></div>
<div style="padding: 12px; border-radius: 16px; background: #fff"><span style="font-size: 12px; color: #6E685E">最常用</span><b class="num" style="display: block; font-family: 'Noto Serif TC', serif; font-size: 22px; font-weight: 700; margin-top: 4px">{{ top }}</b></div>
</div>
<div class="r2" style="margin-top: 10px; padding: 16px; border-radius: 18px; background: #fff">
<div style="display: flex; justify-content: space-between; font-size: 13px; color: #6E685E"><span>這週每天幾分鐘</span><span>11/23–11/29</span></div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; align-items: end; height: 120px; margin-top: 12px" role="img" aria-label="{{ chartAria }}">
<sc-for list="{{ bars }}" as="b" hint-placeholder-count="7">
<div style="display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 6px">
<div class="bar" style="{{ b.style }}"></div>
</div>
</sc-for>
</div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; margin-top: 6px; text-align: center; font-size: 11px; color: #6E685E">
<span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
</div>
</div>
<h2 class="r3" style="margin: 18px 0 8px; font-size: 13px; font-weight: 500; color: #6E685E; letter-spacing: 0.08em">最近</h2>
<div class="r3" style="background: #fff; border-radius: 18px; overflow: hidden">
<sc-for list="{{ logs }}" as="l" hint-placeholder-count="3">
<a class="row" href="Member.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid #EFE9DF; color: #1F1D1A; text-decoration: none">
<img src="{{ l.img }}" alt="" style="width: 34px">
<span style="flex: 1"><b style="display: block; font-weight: 500; font-size: 15px">{{ l.title }}</b><span style="font-size: 12.5px; color: #6E685E">{{ l.sub }}</span></span>
<span style="font-size: 12px; padding: 4px 10px; border-radius: 12px; background: #EEF2E8; color: #3B4D33">{{ l.feel }}</span>
</a>
</sc-for>
</div>
</div>
<nav aria-label="主要分頁" style="position: absolute; left: 0; right: 0; bottom: 0; height: 88px; box-sizing: border-box; padding: 8px 10px 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: rgba(244,241,235,.94); border-top: 1px solid #E4DDD1; font-size: 11px">
<a href="Home.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #8A8478; text-decoration: none"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 4l9 6.5V20H3z"/><path d="M9.5 20v-5h5v5"/></svg>今天</a>
<a href="Records.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #4F6644; text-decoration: none"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="4" y="4" width="16" height="17" rx="2.5"/><path d="M8 2.5v3M16 2.5v3M4 9.5h16M8 14h4M8 17.5h7"/></svg>紀錄</a>
<a href="Achieve.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #8A8478; text-decoration: none"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="9" r="6"/><path d="m8.5 14 -1.5 7.5 5-2.5 5 2.5-1.5-7.5"/></svg>成就</a>
<a href="Shop.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #8A8478; text-decoration: none"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1.2 12H6.2z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg>商店</a>
</nav>
<div style="position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: #1F1D1A"></div>
</div>
</template>
<div id="screen"></div>
<script>

class Component extends DCLogic {
  constructor(p){ super(p); this.state = { who: 0 }; }
  renderVals() {
    const D = {
      0: { kid: [10, 10, 10, 0, 0, 0, 0], me: [10, 0, 10, 10, 0, 0, 0], top: '清嵐' },
    };
    const kid = [10, 10, 10, 10, 0, 0, 0], me = [10, 0, 10, 10, 0, 0, 0];
    const w = this.state.who, today = 3;
    const vals = [0, 1, 2, 3, 4, 5, 6].map(i => w === 0 ? kid[i] + me[i] : w === 1 ? kid[i] : me[i]);
    const max = w === 0 ? 20 : 10;
    const B = ['img/bottle1.webp', 'img/bottle2.webp', 'img/bottle3.webp', 'img/bottle4.webp'];
    const L = [[0, '孩子・No.01 清嵐', '今天 20:31・10 分鐘', '舒服', 1], [3, '我・No.04 棲月', '今天 07:40・10 分鐘', '普通', 2], [0, '孩子・No.01 清嵐', '昨天 20:28・10 分鐘', '舒服', 1], [2, '我・No.03 潤金', '昨天 07:52・10 分鐘', '舒服', 2]];
    const n = vals.filter(v => v > 0).length * (w === 0 ? 1 : 1);
    return {
      knob: 'calc(2px + ' + w + ' * (100% - 4px) / 3)',
      tabs: ['全家', '孩子', '我'].map((l, i) => ({ label: l, on: w === i ? 'true' : 'false', pick: () => this.setState({ who: i }) })),
      times: w === 0 ? 7 : w === 1 ? 4 : 3, mins: w === 0 ? 70 : w === 1 ? 40 : 30, top: w === 2 ? '棲月' : '清嵐',
      chartAria: '這週每天使用分鐘：' + vals.join('、'),
      bars: vals.map((v, i) => ({ style: 'width:100%;max-width:26px;border-radius:7px;height:' + Math.max(6, (v / max) * 100) + '%;background:' + (v ? (i === today ? '#4F6644' : '#A9BC9C') : '#ECE6DB') })),
      logs: L.filter(l => w === 0 || l[4] === w).map(l => ({ img: B[l[0]], title: l[1], sub: l[2], feel: l[3] }))
    };
  }
}

dcMount(Component, {});
</script>
</body></html>
