<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#F4F1EB">
<title>岫本・進行中</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#1F1D1A;-webkit-tap-highlight-color:transparent}#screen{position:fixed;left:0;top:0;width:390px;height:844px;transform-origin:0 0;overflow:hidden}</style>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&amp;family=Noto+Serif+TC:wght@500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#fff}a:hover{color:#E3EBDC}
@keyframes cloud{0%{transform:translateX(-30px)}100%{transform:translateX(30px)}}
@keyframes mist{0%{transform:translateY(10px) scale(.9);opacity:0}30%{opacity:.55}100%{transform:translateY(-70px) scale(1.3);opacity:0}}
@keyframes eq{0%,100%{height:4px}50%{height:16px}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.c1{animation:cloud 9s ease-in-out infinite alternate}.c2{animation:cloud 12s ease-in-out infinite alternate-reverse}
.m{position:absolute;left:50%;width:70px;height:70px;margin-left:-35px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.55),rgba(255,255,255,0) 70%);animation:mist 3.6s ease-out infinite}
.m.b{animation-delay:1.2s;margin-left:-55px}.m.c{animation-delay:2.4s;margin-left:-15px}
.eq b{display:block;width:3px;border-radius:2px;background:#E3EBDC;animation:eq .9s ease-in-out infinite}
.eq b:nth-child(2){animation-delay:-.3s}.eq b:nth-child(3){animation-delay:-.6s}
.eq.off b{animation:none;height:4px}
.ring{transition:stroke-dashoffset .9s linear}
.r1{animation:rise .5s both}.r2{animation:rise .5s .1s both}.r3{animation:rise .5s .2s both}
.card{transition:transform .15s,background .2s}.card:active{transform:scale(.97)}
</style>

<script src="sound.js"></script>
<script src="dc.js"></script>
</head><body>
<template id="tpl">
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: linear-gradient(180deg, #2F3C2A 0%, #4F6644 58%, #6E8460 100%); color: #fff; font-family: -apple-system, 'SF Pro Text', 'Noto Sans TC', sans-serif; padding: 62px 20px 0">
<svg class="c1" width="240" height="80" viewBox="0 0 240 80" aria-hidden="true" style="position: absolute; left: -40px; top: 120px; opacity: .12"><path d="M30 70c-16 0-26-10-26-22s10-22 24-22c4-14 16-24 32-24 14 0 26 8 30 20 4-2 8-3 12-3 14 0 24 9 26 21h80c14 0 26 9 26 15H30z" fill="#fff"/></svg>
<svg class="c2" width="200" height="70" viewBox="0 0 240 80" aria-hidden="true" style="position: absolute; right: -50px; top: 300px; opacity: .1"><path d="M30 70c-16 0-26-10-26-22s10-22 24-22c4-14 16-24 32-24 14 0 26 8 30 20 4-2 8-3 12-3 14 0 24 9 26 21h80c14 0 26 9 26 15H30z" fill="#fff"/></svg>
<div class="r1" style="position: relative; display: flex; align-items: center; justify-content: space-between">
<span style="display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; border-radius: 20px; background: rgba(255,255,255,.14); font-size: 14px"><span style="display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: #E3EBDC; color: #3B4D33; font-weight: 700; font-size: 13px">孩</span>孩子・No.01 清嵐</span>
<button onClick="{{ fast }}" style="min-height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid rgba(255,255,255,.4); background: none; color: #fff; font: inherit; font-size: 12px; cursor: pointer">{{ fastLabel }}</button>
</div>
<div class="r1" style="position: relative; width: 260px; height: 260px; margin: 34px auto 0">
<div class="m"></div><div class="m b"></div><div class="m c"></div>
<svg width="260" height="260" viewBox="0 0 260 260" aria-hidden="true" style="position: absolute; inset: 0; transform: rotate(-90deg)"><circle cx="130" cy="130" r="118" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="8"/><circle class="ring" cx="130" cy="130" r="118" fill="none" stroke="#E3EBDC" stroke-width="8" stroke-linecap="round" stroke-dasharray="741.4" stroke-dashoffset="{{ off }}"/></svg>
<div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center">
<span style="font-size: 14px; letter-spacing: 0.2em; opacity: .8">{{ state }}</span>
<span style="font-family: 'Noto Serif TC', serif; font-size: 64px; font-weight: 500; font-variant-numeric: tabular-nums; line-height: 1.1">{{ time }}</span>
<span style="font-size: 13px; opacity: .75">輕輕吸，不用用力</span>
</div>
</div>
<div class="r2" style="position: relative; display: flex; flex-direction: column; gap: 10px; margin-top: 30px">
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 18px; background: rgba(255,255,255,.12); backdrop-filter: blur(12px)">
<button onClick="{{ toggleMusic }}" aria-label="{{ musicAria }}" style="display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; border: 0; background: #fff; cursor: pointer">
<sc-if value="{{ playing }}" hint-placeholder-val="{{ true }}"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="2" width="3.5" height="12" rx="1" fill="#2F3C2A"/><rect x="9.5" y="2" width="3.5" height="12" rx="1" fill="#2F3C2A"/></svg></sc-if>
<sc-if value="{{ paused }}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z" fill="#2F3C2A"/></svg></sc-if>
</button>
<span style="flex: 1"><span style="display: block; font-size: 12px; opacity: .75">音樂</span><b style="font-weight: 500; font-size: 15px">山林晨霧</b></span>
<span class="eq {{ eqClass }}" aria-hidden="true" style="display: flex; align-items: flex-end; gap: 3px; height: 16px"><b></b><b></b><b></b></span>
</div>
<a class="card" href="Breathe.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 18px; background: rgba(255,255,255,.12); text-decoration: none; color: #fff">
<span style="display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; background: #E3EBDC"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2F3C2A" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M7 17c-2.5 0-4-1.6-4-3.6S4.5 10 7 10c.4-2.6 2.3-4.2 4.8-4.2s4.5 1.6 4.9 4c1.9.3 3.3 1.8 3.3 3.6 0 2-1.6 3.6-3.8 3.6z"/></svg></span>
<span style="flex: 1"><span style="display: block; font-size: 12px; opacity: .75">小遊戲</span><b style="font-weight: 500; font-size: 15px">跟著雲朵呼吸</b></span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>
</a>
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 18px; background: rgba(255,255,255,.12)">
<span style="display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,.2)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/></svg></span>
<span style="flex: 1"><span style="display: block; font-size: 12px; opacity: .75">本草故事</span><b style="font-weight: 500; font-size: 15px">清嵐：山裡的一陣風</b></span>
</div>
</div>
<div class="r3" style="position: absolute; left: 20px; right: 20px; bottom: 44px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button onClick="{{ togglePause }}" style="min-height: 54px; border-radius: 27px; border: 1.5px solid rgba(255,255,255,.55); background: none; color: #fff; font: inherit; font-size: 16px; cursor: pointer">{{ pauseLabel }}</button>
<sc-if value="{{ finished }}" hint-placeholder-val="{{ false }}"><a href="Done.html" style="display: grid; place-items: center; min-height: 54px; border-radius: 27px; background: #fff; color: #2F3C2A; font-size: 16px; font-weight: 500; text-decoration: none">完成</a></sc-if>
<sc-if value="{{ notFinished }}" hint-placeholder-val="{{ true }}"><button onClick="{{ askEnd }}" style="min-height: 54px; border: 0; border-radius: 27px; background: #fff; color: #2F3C2A; font: inherit; font-size: 16px; font-weight: 500; cursor: pointer">結束</button></sc-if>
</div>
<sc-if value="{{ asking }}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; background: rgba(20,24,18,.55); animation: rise .25s both"></div>
<div role="alertdialog" aria-label="提早結束" style="position: absolute; left: 20px; right: 20px; bottom: 40px; padding: 22px 20px 16px; border-radius: 24px; background: #F4F1EB; color: #1F1D1A; animation: rise .35s cubic-bezier(.2,.8,.2,1) both">
<b style="display: block; font-size: 18px; font-weight: 600">還剩 {{ time }}，要提早結束嗎？</b>
<p style="margin: 8px 0 0; font-size: 14px; line-height: 1.6; color: #5E584F">要用滿 10 分鐘，這次才會算進全家的成就和雲點。這瓶藥已經綁定這次使用，結束後不能再掃描。</p>
<button onClick="{{ keep }}" style="width: 100%; min-height: 52px; margin-top: 16px; border: 0; border-radius: 26px; background: #4F6644; color: #fff; font: inherit; font-size: 16px; font-weight: 500; cursor: pointer">繼續用完</button>
<a href="Home.html" style="display: grid; place-items: center; min-height: 48px; margin-top: 4px; color: #B4553F; font-size: 15px; text-decoration: none">仍要結束（不計入）</a>
</div>
</sc-if>
<div style="position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: #fff"></div>
</div>
</template>
<div id="screen"></div>
<script>

class Component extends DCLogic {
  constructor(p){ super(p); this.state = { left: 600, paused: false, music: false, speed: 1 }; }
  componentDidMount(){ this.t = setInterval(() => { if (!this.state.paused && this.state.left > 0) this.setState({ left: Math.max(0, this.state.left - this.state.speed) }); }, 1000); }
  componentWillUnmount(){ clearInterval(this.t); }
  renderVals() {
    const s = this.state, m = Math.floor(s.left / 60), sec = s.left % 60;
    return {
      time: String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0'),
      off: (741.4 * (1 - s.left / 600)).toFixed(1),
      state: s.left === 0 ? '完成' : s.paused ? '已暫停' : '出霧中',
      pauseLabel: s.paused ? '繼續' : '暫停',
      togglePause: () => this.setState({ paused: !s.paused }),
      playing: s.music, paused: !s.music, eqClass: s.music && !s.paused ? '' : 'off', musicAria: s.music ? '暫停音樂' : '播放音樂',
      toggleMusic: () => { if (window.XB) XB.music(!s.music, .8); this.setState({ music: !s.music }); },
      finished: s.left === 0, notFinished: s.left > 0, asking: !!s.ask && s.left > 0,
      askEnd: () => this.setState({ ask: true }), keep: () => this.setState({ ask: false }),
      fastLabel: s.speed > 1 ? '正常速度' : '示範加速',
      fast: () => this.setState({ speed: s.speed > 1 ? 1 : 30 })
    };
  }
}

dcMount(Component, {});
</script>
</body></html>
