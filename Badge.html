<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#F4F1EB">
<title>岫本・獎章詳情</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#1F1D1A;-webkit-tap-highlight-color:transparent}#screen{position:fixed;left:0;top:0;width:390px;height:844px;transform-origin:0 0;overflow:hidden}</style>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&amp;family=Noto+Serif+TC:wght@500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#E7CF9D}a:hover{color:#fff}
@keyframes spinIn{0%{transform:perspective(600px) rotateY(-540deg) scale(.4);opacity:0}70%{opacity:1}100%{transform:perspective(600px) rotateY(0) scale(1);opacity:1}}
@keyframes sway{0%,100%{transform:perspective(600px) rotateY(-12deg)}50%{transform:perspective(600px) rotateY(12deg)}}
@keyframes rays{to{transform:rotate(360deg)}}
@keyframes shine{0%{transform:translateX(-130%) rotate(25deg)}55%,100%{transform:translateX(230%) rotate(25deg)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes spark{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}
.in{animation:spinIn 1.4s cubic-bezier(.2,.8,.2,1) both}
.sw{animation:sway 5s 1.4s ease-in-out infinite}
.rays{animation:rays 30s linear infinite}
.sh{position:absolute;top:-20%;bottom:-20%;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);animation:shine 3.4s 1.4s ease-in-out infinite}
.r1{animation:rise .5s 1s both}.r2{animation:rise .5s 1.15s both}.r3{animation:rise .5s 1.3s both}
.sp{position:absolute;width:8px;height:8px;border-radius:50%;background:#F1DDB0;box-shadow:0 0 10px #F1DDB0;animation:spark 2.4s ease-in-out infinite}
.btn{transition:transform .15s}.btn:active{transform:scale(.97)}
</style>

<script src="dc.js"></script>
</head><body>
<template id="tpl">
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: radial-gradient(120% 70% at 50% 30%, #3F5A2C 0%, #1E271A 70%); color: #fff; font-family: -apple-system, 'SF Pro Text', 'Noto Sans TC', sans-serif; padding: 62px 20px 0">
<a href="Achieve.html" style="display: inline-flex; align-items: center; gap: 2px; min-height: 44px; font-size: 17px; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>成就</a>
<div style="position: relative; height: 330px; display: grid; place-items: center">
<svg class="rays" width="340" height="340" viewBox="0 0 340 340" aria-hidden="true" style="position: absolute; opacity: .18"><g fill="#F1DDB0"><path d="M170 0l6 150h-12z"/><path d="M170 340l-6-150h12z"/><path d="M0 170l150-6v12z"/><path d="M340 170l-150 6v-12z"/><path d="M50 50l113 113-6 6z"/><path d="M290 290L177 177l6-6z"/><path d="M290 50L177 163l-6-6z"/><path d="M50 290l113-113 6 6z"/></g></svg>
<span class="sp" style="left: 70px; top: 70px; animation-delay: .2s"></span><span class="sp" style="right: 80px; top: 100px; animation-delay: .9s"></span><span class="sp" style="left: 90px; bottom: 70px; animation-delay: 1.6s"></span><span class="sp" style="right: 60px; bottom: 90px; animation-delay: 2.1s"></span>
<div class="in"><div class="sw" style="position: relative; width: 210px; height: 210px; border-radius: 50%; overflow: hidden; box-shadow: 0 30px 60px rgba(0,0,0,.45)">
<svg width="210" height="210" viewBox="0 0 92 92" role="img" aria-label="獎章：家人同行">
<defs><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B89462"/><stop offset=".5" stop-color="#F1DDB0"/><stop offset="1" stop-color="#9C7A4C"/></linearGradient></defs>
<circle cx="46" cy="46" r="44" fill="url(#gold)"/><circle cx="46" cy="46" r="36" fill="#5A3A2A"/>
<circle cx="46" cy="46" r="31" fill="none" stroke="#F1DDB0" stroke-width=".8" stroke-dasharray="2 3" opacity=".7"/>
<path d="M22 60c6-7 12-10 18-9 3-5 9-8 14-6 5-4 12-3 16 2" fill="none" stroke="#F1DDB0" stroke-width="1.2" opacity=".5"/>
<text x="46" y="55" text-anchor="middle" font-family="Noto Serif TC, serif" font-size="28" font-weight="700" fill="#F4E6C6">同</text>
</svg>
<span class="sh"></span>
</div></div>
</div>
<div style="text-align: center">
<p class="r1" style="margin: 0; font-size: 13px; letter-spacing: 0.24em; color: #E7CF9D">11 月 24 日獲得</p>
<h1 class="r1" style="margin: 6px 0 0; font-family: 'Noto Serif TC', serif; font-weight: 700; font-size: 34px; letter-spacing: 0.16em">家人同行</h1>
<p class="r2" style="margin: 10px 18px 0; font-size: 15px; line-height: 1.7; color: rgba(255,255,255,.82)">同一天裡，我和孩子都用了一次岫本。</p>
</div>
<div class="r3" style="display: flex; gap: 10px; margin-top: 22px">
<div style="flex: 1; padding: 12px 14px; border-radius: 16px; background: rgba(255,255,255,.1)"><span style="font-size: 12px; opacity: .7">一起完成</span><b style="display: block; margin-top: 4px; font-weight: 500">我、孩子</b></div>
<div style="flex: 1; padding: 12px 14px; border-radius: 16px; background: rgba(255,255,255,.1)"><span style="font-size: 12px; opacity: .7">獲得</span><b style="display: block; margin-top: 4px; font-weight: 500; color: #E7CF9D">＋50 雲點</b></div>
</div>
<div style="position: absolute; left: 20px; right: 20px; bottom: 44px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button class="btn" style="min-height: 54px; border-radius: 27px; border: 1.5px solid rgba(255,255,255,.5); background: none; color: #fff; font: inherit; font-size: 16px; cursor: pointer">分享</button>
<a class="btn" href="Rewards.html" style="display: grid; place-items: center; min-height: 54px; border-radius: 27px; background: #E7CF9D; color: #1E271A; font-size: 16px; font-weight: 500; text-decoration: none">用雲點兌換</a>
</div>
<div style="position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: #fff"></div>
</div>
</template>
<div id="screen"></div>

</script>
</body></html>
