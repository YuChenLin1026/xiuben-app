<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#F4F1EB">
<title>岫本・新增家人</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#1F1D1A;-webkit-tap-highlight-color:transparent}#screen{position:fixed;left:0;top:0;width:390px;height:844px;transform-origin:0 0;overflow:hidden}</style>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&amp;family=Noto+Serif+TC:wght@500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#4F6644}a:hover{color:#3B4D33}
@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes dim{from{opacity:0}to{opacity:1}}
.sheet{animation:sheet .55s cubic-bezier(.2,.9,.25,1) both}
.dim{animation:dim .4s ease both}
.chip{transition:background .2s,color .2s,border-color .2s,transform .15s}.chip:active{transform:scale(.95)}
.bar{transition:height .5s cubic-bezier(.3,1.4,.5,1)}
.knob{transition:left .35s cubic-bezier(.2,.8,.2,1)}
input:focus{outline:2px solid #4F6644;outline-offset:2px}
</style>

<script src="dc.js"></script>
</head><body>
<template id="tpl">
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #D9D4CB; color: #1F1D1A; font-family: -apple-system, 'SF Pro Text', 'Noto Sans TC', sans-serif">
<div class="dim" style="position: absolute; inset: 0; background: rgba(31,29,26,.35)"></div>
<div class="sheet" style="position: absolute; left: 0; right: 0; top: 54px; bottom: 0; border-radius: 14px 14px 0 0; background: #F4F1EB; padding: 8px 20px 0; box-sizing: border-box">
<div style="width: 36px; height: 5px; border-radius: 3px; background: #CFC8BC; margin: 0 auto"></div>
<div style="display: flex; align-items: center; justify-content: space-between; height: 48px">
<a href="Family.html" style="font-size: 17px; text-decoration: none; min-width: 44px">取消</a>
<b style="font-size: 17px; font-weight: 600">新增家人</b>
<a href="Family.html" style="font-size: 17px; font-weight: 600; text-decoration: none; min-width: 44px; text-align: right">儲存</a>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px; margin-top: 10px">
<span style="display: grid; place-items: center; width: 76px; height: 76px; border-radius: 50%; background: {{ avBg }}; color: {{ avFg }}; font-size: 28px; font-weight: 700; transition: background .3s">{{ initial }}</span>
<div style="display: flex; gap: 10px">
<sc-for list="{{ colors }}" as="c" hint-placeholder-count="4">
<button class="chip" onClick="{{ c.pick }}" aria-label="{{ c.label }}" style="{{ c.style }}"></button>
</sc-for>
</div>
</div>
<label for="nm" style="display: block; margin-top: 18px; font-size: 13px; color: #6E685E">怎麼稱呼</label>
<input id="nm" value="{{ name }}" onInput="{{ onName }}" placeholder="例如：小宇" style="margin-top: 6px; width: 100%; box-sizing: border-box; min-height: 50px; border-radius: 14px; border: 0; background: #fff; padding: 0 16px; font: inherit; font-size: 17px; color: #1F1D1A">
<p style="margin: 18px 0 6px; font-size: 13px; color: #6E685E">身分</p>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{ roles }}" as="r" hint-placeholder-count="3">
<button class="chip" onClick="{{ r.pick }}" aria-pressed="{{ r.on }}" style="{{ r.style }}">{{ r.label }}</button>
</sc-for>
</div>
<p style="margin: 18px 0 6px; font-size: 13px; color: #6E685E">坐著時，機身拉到</p>
<div style="display: flex; gap: 14px; align-items: stretch; background: #fff; border-radius: 18px; padding: 14px">
<div style="width: 58px; height: 120px; position: relative; display: flex; flex-direction: column; justify-content: flex-end; align-items: center">
<div style="width: 26px; height: 16px; border-radius: 3px 3px 10px 10px; background: #DCE3D5"></div>
<div class="bar" style="width: 10px; height: {{ tube }}px; background: linear-gradient(#ffffff,#E8ECE3); border-left: 1px solid #DCE3D5; border-right: 1px solid #DCE3D5"></div>
<div style="width: 34px; height: 50px; border-radius: 8px 8px 4px 4px; background: #A9BC9C"></div>
</div>
<div style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 10px">
<b style="font-size: 26px; font-family: 'Noto Serif TC', serif; font-weight: 700">{{ mm }}<span style="font-size: 14px; color: #6E685E; font-family: -apple-system, 'Noto Sans TC', sans-serif; font-weight: 400"> mm</span></b>
<div role="group" aria-label="機身高度" style="position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: #EFEAE1; border-radius: 10px; padding: 2px; height: 36px">
<span class="knob" style="position: absolute; top: 2px; bottom: 2px; width: calc((100% - 4px)/3); left: {{ knob }}; border-radius: 8px; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.12)"></span>
<sc-for list="{{ hs }}" as="h" hint-placeholder-count="3">
<button onClick="{{ h.pick }}" aria-pressed="{{ h.on }}" style="position: relative; border: 0; background: none; font: inherit; font-size: 13px; color: #1F1D1A; cursor: pointer">{{ h.label }}</button>
</sc-for>
</div>
</div>
</div>
<p style="margin: 10px 2px 0; font-size: 12.5px; line-height: 1.6; color: #6E685E">之後每次選到這位家人，開始前會提醒拉到這個高度。</p>
</div>
</div>
</template>
<div id="screen"></div>
<script>

class Component extends DCLogic {
  constructor(p){ super(p); this.state = { name: '孩子', role: 0, h: 0, c: 0 }; }
  renderVals() {
    const C = [['#E3EBDC','#3B4D33','鼠尾草綠'],['#F1E6D6','#6B4E25','香檳金'],['#E6E1F0','#4A3F6B','淡紫'],['#DDE8EE','#2E4F5E','霧藍']];
    const R = ['孩子','大人','長輩'], H = [['收合',250],['拉高 50',300],['拉高 100',350]];
    const s = this.state;
    return {
      name: s.name, initial: (s.name || '?').slice(0, 1), avBg: C[s.c][0], avFg: C[s.c][1],
      onName: (e) => this.setState({ name: e.target.value }),
      colors: C.map((c, i) => ({ label: c[2], pick: () => this.setState({ c: i }), style: 'width:30px;height:30px;border-radius:50%;cursor:pointer;background:' + c[0] + ';border:2px solid ' + (s.c === i ? c[1] : 'transparent') })),
      roles: R.map((l, i) => ({ label: l, on: s.role === i ? 'true' : 'false', pick: () => this.setState({ role: i, h: i === 0 ? 0 : 1 }), style: 'min-height:44px;border-radius:12px;font:inherit;font-size:15px;cursor:pointer;border:1.5px solid ' + (s.role === i ? '#4F6644' : '#E4DDD1') + ';background:' + (s.role === i ? '#EEF2E8' : '#fff') + ';color:#1F1D1A' })),
      hs: H.map((h, i) => ({ label: h[0], on: s.h === i ? 'true' : 'false', pick: () => this.setState({ h: i }) })),
      knob: 'calc(2px + ' + s.h + ' * (100% - 4px) / 3)', mm: H[s.h][1], tube: 6 + s.h * 22
    };
  }
}

dcMount(Component, {});
</script>
</body></html>
