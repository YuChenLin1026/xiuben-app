<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#F4F1EB">
<title>岫本・跟著小岫呼吸</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#1F1D1A;-webkit-tap-highlight-color:transparent}#screen{position:fixed;left:0;top:0;width:390px;height:844px;transform-origin:0 0;overflow:hidden}</style>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&amp;family=Noto+Serif+TC:wght@500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#2F3C2A}a:hover{color:#1F1D1A}
@keyframes breath{0%{transform:scale(.68)}43%{transform:scale(1)}57%{transform:scale(1)}100%{transform:scale(.68)}}
@keyframes idle{0%,100%{transform:translateY(0) scale(.8)}50%{transform:translateY(-8px) scale(.8)}}
@keyframes halo{0%{transform:scale(.7);opacity:0}43%{transform:scale(1.25);opacity:.5}100%{transform:scale(1.5);opacity:0}}
@keyframes puff{0%{transform:translate(0,0) scale(.4);opacity:0}20%{opacity:.95}100%{transform:translate(120px,-50px) scale(1.4);opacity:0}}
@keyframes star{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.35) rotate(10deg)}100%{transform:scale(1) rotate(0)}}
@keyframes bloom{0%{transform:scale(0)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes fly{0%{transform:translate(-60px,0)}50%{transform:translate(220px,-24px)}100%{transform:translate(480px,0)}}
@keyframes flap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(-.6)}}
@keyframes bubble{0%{transform:scale(.6) translateY(8px);opacity:0}60%{transform:scale(1.06)}100%{transform:none;opacity:1}}
@keyframes sun{0%,100%{transform:rotate(0)}50%{transform:rotate(12deg)}}
@keyframes note{0%{transform:translate(0,0) rotate(0);opacity:0}20%{opacity:1}100%{transform:translate(-30px,-90px) rotate(-20deg);opacity:0}}
.cl{transform-origin:50% 60%;animation:idle 3s ease-in-out infinite}.cl.on{animation:breath 7s ease-in-out infinite}
.halo{position:absolute;left:50%;top:50%;width:240px;height:240px;margin:-120px 0 0 -120px;border-radius:50%;background:radial-gradient(circle,#fff,rgba(255,255,255,0) 70%);opacity:0}.halo.on{animation:halo 7s ease-out infinite}
.pf{position:absolute;left:62%;top:52%;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle,#fff 40%,rgba(255,255,255,0) 72%);opacity:0;animation:puff 2.4s ease-out infinite}
.pf.b{animation-delay:.6s;top:56%}.pf.c{animation-delay:1.2s;top:48%}
.st{animation:star .45s cubic-bezier(.2,.8,.2,1) both}
.fw{transform-origin:50% 100%;animation:bloom .6s cubic-bezier(.2,.8,.2,1.4) both}
.fw .hd{transform-origin:50% 100%;animation:sway 3s ease-in-out infinite}
.bird{position:absolute;top:150px;left:0;animation:fly 14s linear infinite}.bird.b{top:190px;animation-delay:-6s;animation-duration:17s}
.wing{transform-origin:50% 50%;animation:flap .5s ease-in-out infinite}
.bb{animation:bubble .4s cubic-bezier(.2,.8,.2,1) both}
.sun{transform-origin:50% 50%;animation:sun 6s ease-in-out infinite}
.nt{position:absolute;font-size:22px;color:#4F6644;opacity:0;animation:note 2.6s ease-out infinite}
.btn{transition:transform .15s}.btn:active{transform:scale(.96)}
.tg{transition:background .2s,color .2s}
</style>

<script src="dc.js"></script>
</head><body>
<template id="tpl">
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: linear-gradient(180deg, #BFD8E6 0%, #E4EEE0 58%, #F4F1EB 100%); color: #1F1D1A; font-family: -apple-system, 'SF Pro Text', 'Noto Sans TC', sans-serif; padding: 62px 20px 0">
<svg class="sun" width="86" height="86" viewBox="0 0 86 86" aria-hidden="true" style="position: absolute; right: 26px; top: 104px"><g stroke="#F5C46A" stroke-width="4" stroke-linecap="round"><path d="M43 4v10M43 72v10M4 43h10M72 43h10M15 15l7 7M64 64l7 7M71 15l-7 7M22 64l-7 7"/></g><circle cx="43" cy="43" r="20" fill="#FFD989"/><path d="M35 46q8 7 16 0" fill="none" stroke="#B7832A" stroke-width="2.5" stroke-linecap="round"/><circle cx="36" cy="39" r="2.4" fill="#B7832A"/><circle cx="50" cy="39" r="2.4" fill="#B7832A"/></svg>
<div class="bird"><svg width="34" height="18" viewBox="0 0 34 18" aria-hidden="true"><g class="wing"><path d="M2 9q8-8 15 0q7-8 15 0" fill="none" stroke="#5B6E66" stroke-width="2.4" stroke-linecap="round"/></g></svg></div>
<div class="bird b"><svg width="26" height="14" viewBox="0 0 34 18" aria-hidden="true"><g class="wing"><path d="M2 9q8-8 15 0q7-8 15 0" fill="none" stroke="#5B6E66" stroke-width="2.4" stroke-linecap="round"/></g></svg></div>
<svg width="430" height="210" viewBox="0 0 430 210" aria-hidden="true" style="position: absolute; left: -20px; bottom: 150px"><path d="M0 210V120q60-50 120-20t110-30q60-30 110 10t90 10v120z" fill="#B9CFA8"/><path d="M0 210v-50q80-40 150-10t130-20q70-20 150 20v60z" fill="#9BBA88"/></svg>
<div style="position: absolute; left: 0; right: 0; bottom: 176px; height: 60px; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); padding: 0 26px">
<sc-for list="{{ flowers }}" as="f" hint-placeholder-count="6">
<div style="display: flex; align-items: flex-end; justify-content: center">
<sc-if value="{{ f.open }}" hint-placeholder-val="{{ false }}">
<svg class="fw" width="34" height="52" viewBox="0 0 34 52" aria-hidden="true"><path d="M17 52V24" stroke="#5E8A4E" stroke-width="3" stroke-linecap="round"/><path d="M17 40q-9-2-11-10q9 0 11 8" fill="#7FA36B"/><g class="hd"><circle cx="17" cy="9" r="6" fill="{{ f.c }}"/><circle cx="9" cy="15" r="6" fill="{{ f.c }}"/><circle cx="25" cy="15" r="6" fill="{{ f.c }}"/><circle cx="12" cy="23" r="6" fill="{{ f.c }}"/><circle cx="22" cy="23" r="6" fill="{{ f.c }}"/><circle cx="17" cy="16" r="5" fill="#FFE29A"/></g></svg>
</sc-if>
<sc-if value="{{ f.closed }}" hint-placeholder-val="{{ true }}"><span style="display: block; width: 8px; height: 10px; border-radius: 8px 8px 2px 2px; background: #6E8F5E; opacity: .5"></span></sc-if>
</div>
</sc-for>
</div>
<div style="position: relative; display: flex; align-items: center; justify-content: space-between">
<a class="btn" href="Session.html" style="display: inline-flex; align-items: center; gap: 2px; min-height: 44px; font-size: 17px; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>回計時</a>
<div style="display: flex; gap: 6px">
<button class="tg" onClick="{{ tMusic }}" aria-pressed="{{ musicOn }}" style="{{ musicStyle }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>音樂</button>
</div>
</div>
<p style="position: relative; margin: 6px 0 0; text-align: center; font-size: 13px; letter-spacing: 0.2em; color: #3E5560">小岫呼吸劇場・第 {{ ep }} 回</p>
<div style="position: relative; height: 300px; margin-top: 4px">
<div class="halo {{ onCls }}"></div>
<sc-if value="{{ isOut }}" hint-placeholder-val="{{ false }}"><span class="pf"></span><span class="pf b"></span><span class="pf c"></span></sc-if>
<sc-if value="{{ isMusic }}" hint-placeholder-val="{{ false }}"><span class="nt" style="left: 40px; top: 160px">♪</span><span class="nt" style="left: 300px; top: 140px; animation-delay: 1.3s">♫</span></sc-if>
<svg class="cl {{ onCls }}" viewBox="0 0 240 150" role="img" aria-label="雲朵小岫，會跟著呼吸變大變小" style="position: absolute; left: 50%; top: 50%; width: 260px; margin: -84px 0 0 -130px; filter: drop-shadow(0 18px 24px rgba(60,80,60,.18))">
<path d="M52 140c-26 0-46-18-46-40 0-21 17-38 39-40 6-30 32-52 64-52 28 0 52 17 61 41 4-1 8-1 12-1 28 0 52 22 52 50s-24 42-52 42z" fill="#fff"/>
<sc-if value="{{ faceIn }}" hint-placeholder-val="{{ false }}"><path d="M88 92q8-8 16 0M138 92q8-8 16 0" fill="none" stroke="#2F3C2A" stroke-width="4" stroke-linecap="round"/><circle cx="121" cy="112" r="5" fill="#2F3C2A"/></sc-if>
<sc-if value="{{ faceOut }}" hint-placeholder-val="{{ false }}"><circle cx="96" cy="92" r="6" fill="#2F3C2A"/><circle cx="146" cy="92" r="6" fill="#2F3C2A"/><ellipse cx="121" cy="114" rx="9" ry="11" fill="#2F3C2A"/></sc-if>
<sc-if value="{{ faceHappy }}" hint-placeholder-val="{{ true }}"><circle cx="96" cy="92" r="6" fill="#2F3C2A"/><circle cx="146" cy="92" r="6" fill="#2F3C2A"/><path d="M108 108q13 12 26 0" fill="none" stroke="#2F3C2A" stroke-width="4" stroke-linecap="round"/></sc-if>
<circle cx="80" cy="110" r="9" fill="#F6C9C0" opacity=".85"/><circle cx="162" cy="110" r="9" fill="#F6C9C0" opacity=".85"/>
</svg>
<div class="bb" style="position: absolute; left: 50%; top: 4px; transform: translateX(-50%); padding: 8px 16px; border-radius: 18px; background: #fff; font-family: 'Noto Serif TC', serif; font-size: 22px; font-weight: 700; color: #2F3C2A; box-shadow: 0 6px 16px rgba(47,60,42,.12); white-space: nowrap">{{ cue }}</div>
</div>
<div style="position: relative; display: flex; justify-content: center; gap: 8px; margin-top: 4px" aria-label="{{ starsAria }}">
<sc-for list="{{ stars }}" as="s" hint-placeholder-count="6">
<span class="{{ s.cls }}" style="display: grid; place-items: center"><svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2.8 2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4L2.8 9.5l6.4-.8z" fill="{{ s.fill }}" stroke="#fff" stroke-width="1"/></svg></span>
</sc-for>
</div>
<button class="btn" onClick="{{ toggle }}" style="position: absolute; left: 20px; right: 20px; bottom: 44px; min-height: 58px; border: 0; border-radius: 29px; background: #2F3C2A; color: #fff; font: inherit; font-size: 18px; font-weight: 500; cursor: pointer">{{ btn }}</button>
<p style="position: absolute; left: 20px; right: 20px; bottom: 108px; margin: 0; text-align: center; font-size: 12.5px; color: #3E4F38">每呼吸一輪，山坡開一朵花、拿一顆星。六顆星，小岫送你一張貼紙。</p>
<div style="position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: #1F1D1A"></div>
</div>
</template>
<div id="screen"></div>
<script>

class Component extends DCLogic {
  constructor(p){ super(p); this.state = { on: false, t: 0, n: 0, music: true, voice: true }; }
  componentWillUnmount(){ clearInterval(this.iv); this.stopAudio(); }
  audio(){ if (!this.ac) { const A = window.AudioContext || window.webkitAudioContext; if (!A) return null; this.ac = new A(); this.out = this.ac.createGain(); this.out.gain.value = .5; this.out.connect(this.ac.destination); } if (this.ac.state === 'suspended') this.ac.resume(); return this.ac; }
  stopAudio(){ try { window.speechSynthesis && speechSynthesis.cancel(); } catch (e) {} }
  tone(f, when, dur, vol, type){ const ac = this.ac; if (!ac) return; const o = ac.createOscillator(), g = ac.createGain(); o.type = type || 'triangle'; o.frequency.value = f; const t0 = ac.currentTime + when; g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0 + .02); g.gain.exponentialRampToValueAtTime(.0005, t0 + dur); o.connect(g); g.connect(this.out); o.start(t0); o.stop(t0 + dur + .05); }
  pad(root){ const ac = this.ac; if (!ac) return; [1, 1.5, 2].forEach((m, i) => { const o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 900; o.type = 'sawtooth'; o.frequency.value = root * m; o.detune.value = i * 6 - 6; const t0 = ac.currentTime; g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(.022, t0 + 1.5); g.gain.linearRampToValueAtTime(.0001, t0 + 7); o.connect(f); f.connect(g); g.connect(this.out); o.start(t0); o.stop(t0 + 7.1); }); }
  say(txt){}
  beat(t){
    const ph = t % 7, round = Math.floor(t / 7), m = this.state.music;
    const roots = [130.81, 110, 87.31, 98];
    if (ph === 0) { if (m) { this.pad(roots[round % 4]); [392, 440, 523.25].forEach((f, i) => this.tone(f, i * 1, 1.1, .16)); } this.say('跟小岫一起，慢慢吸～'); }
    if (ph === 3 && m) this.tone(659.25, 0, 1.4, .1, 'sine');
    if (ph === 4) { if (m) [587.33, 523.25, 440, 392].forEach((f, i) => this.tone(f, i * .75, 1, .14)); this.say('慢慢吐～'); }
  }
  renderVals() {
    const s = this.state, ph = s.t % 7, on = s.on;
    const cue = !on ? (s.n >= 6 ? '六顆星全到手！' : '準備好了嗎？') : ph < 3 ? '慢慢吸～' : ph < 4 ? '停一下' : '慢慢吐～';
    const FC = ['#F6B7C1', '#F7D27A', '#B9A5E8', '#F6B7C1', '#9CCDE8', '#F7D27A'];
    return {
      onCls: on ? 'on' : '', cue, ep: Math.min(s.n + 1, 6),
      faceIn: on && ph < 4, faceOut: on && ph >= 4, faceHappy: !on, isOut: on && ph >= 4, isMusic: on && s.music,
      btn: on ? '休息一下' : s.n ? '繼續' : '開始呼吸劇場',
      musicOn: s.music ? 'true' : 'false', voiceOn: s.voice ? 'true' : 'false',
      musicStyle: 'display:inline-flex;align-items:center;gap:4px;min-height:36px;padding:0 12px;border-radius:18px;border:0;font:inherit;font-size:13px;cursor:pointer;' + (s.music ? 'background:#2F3C2A;color:#fff' : 'background:rgba(255,255,255,.7);color:#2F3C2A'),
      voiceStyle: 'display:inline-flex;align-items:center;gap:4px;min-height:36px;padding:0 12px;border-radius:18px;border:0;font:inherit;font-size:13px;cursor:pointer;' + (s.voice ? 'background:#2F3C2A;color:#fff' : 'background:rgba(255,255,255,.7);color:#2F3C2A'),
      tMusic: () => this.setState({ music: !s.music }), tVoice: () => { if (s.voice) this.stopAudio(); this.setState({ voice: !s.voice }); },
      toggle: () => {
        if (on) { clearInterval(this.iv); this.stopAudio(); this.setState({ on: false }); return; }
        this.audio(); this.setState({ on: true, t: 0 }); this.beat(0);
        clearInterval(this.iv);
        this.iv = setInterval(() => {
          const t = this.state.t + 1, done = t % 7 === 0;
          let n = this.state.n;
          if (done) { n = Math.min(6, n + 1); if (this.state.music) [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => this.tone(f, i * .09, .5, .12, 'sine')); this.say(n >= 6 ? '六顆星都拿到了，你好棒！' : '好棒！第' + n + '顆星'); }
          this.setState({ t, n });
          if (done && n >= 6) { clearInterval(this.iv); setTimeout(() => this.setState({ on: false }), 2500); return; }
          if (!done) this.beat(t); else setTimeout(() => this.state.on && this.beat(t), 1600);
        }, 1000);
      },
      starsAria: '已拿到 ' + s.n + ' 顆星',
      stars: [0, 1, 2, 3, 4, 5].map(i => ({ cls: i < s.n ? 'st' : '', fill: i < s.n ? '#E8B54F' : 'rgba(47,60,42,.15)' })),
      flowers: FC.map((c, i) => ({ c, open: i < s.n, closed: i >= s.n }))
    };
  }
}

dcMount(Component, {});
</script>
</body></html>
